version: '3.8'

services:
  # --------------------------------------------------------------------------
  # Base de Datos Relacional PostgreSQL con Esquema Precargado
  # --------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: libreria-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: libreria_oskar
    ports:
      - "5434:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d libreria_oskar"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Base aislada para pruebas automatizadas (no comparte volumen con desarrollo)
  # Iniciar explícitamente con: docker compose --profile test up -d db-test
  # --------------------------------------------------------------------------
  db-test:
    profiles: ["test"]
    image: postgres:15-alpine
    container_name: libreria-db-test
    environment:
      POSTGRES_USER: ${TEST_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-postgres}
      POSTGRES_DB: libreria_oskar_test
    ports:
      - "5435:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER:-postgres} -d libreria_oskar_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # API Backend RESTful en Node.js / Express
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: libreria-backend-local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: libreria_oskar
      GOOGLE_BOOKS_API_KEY: ""
      JWT_SECRET: ${JWT_SECRET:-secreto-solo-para-desarrollo-local}
      JWT_EXPIRES_IN: 8h
      TWO_FACTOR_ENFORCED: ${TWO_FACTOR_ENFORCED:-false}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}
      # Orígenes del navegador separados por coma (obligatoria con NODE_ENV=production). Se sobreescribe
      # desde la terminal, p. ej. para probar desde otro dispositivo de la red local: añadir http://IP-DE-LA-PC:5173
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
    ports:
      - "3000:8080"

volumes:
  pgdata:
  pgdata_test:
