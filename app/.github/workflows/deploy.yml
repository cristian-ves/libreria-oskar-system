name: CI/CD Pipeline - Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'libreria-repo' }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME || 'libreria-backend-api' }}

jobs:
  # ==========================================================================
  # JOB 1: Verificación de Código y Pruebas Automatizadas (CI)
  # ==========================================================================
  test-and-verify:
    name: Run Automated Tests & Verifications
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: libreria_oskar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Initialize PostgreSQL Database Schema
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d libreria_oskar -f database/schema.sql

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Execute Backend Tests (Unit, Integration & E2E)
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: libreria_oskar
        run: npm test

  # ==========================================================================
  # JOB 2: Compilación de Contenedor, Publicación y Despliegue en Cloud Run (CD)
  # ==========================================================================
  build-and-deploy:
    name: Build, Publish to GAR & Deploy to Cloud Run
    needs: test-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Autenticación Segura con Google Cloud mediante Service Account
      # ----------------------------------------------------------------------
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ----------------------------------------------------------------------
      # Configurar Docker para Google Artifact Registry (GAR)
      # ----------------------------------------------------------------------
      - name: Configure Docker Authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # ----------------------------------------------------------------------
      # Construcción y Publicación de Imagen Docker Multi-stage
      # ----------------------------------------------------------------------
      - name: Build and Push Production Docker Image
        env:
          IMAGE_URI: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}
        run: |
          IMAGE_COMMIT="$IMAGE_URI:${{ github.sha }}"
          IMAGE_LATEST="$IMAGE_URI:latest"

          echo "Construyendo imagen Docker multi-etapa desde backend/Dockerfile..."
          docker build \
            --tag "$IMAGE_COMMIT" \
            --tag "$IMAGE_LATEST" \
            --file backend/Dockerfile \
            backend

          echo "Subiendo imagen a Google Artifact Registry..."
          docker push "$IMAGE_COMMIT"
          docker push "$IMAGE_LATEST"

      # ----------------------------------------------------------------------
      # Despliegue Continuo a Google Cloud Run con Conexión a Cloud SQL
      # ----------------------------------------------------------------------
      - name: Deploy to Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --set-cloudsql-instances=${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
            --set-env-vars=NODE_ENV=production,PORT=8080,DB_HOST=/cloudsql/${{ secrets.CLOUD_SQL_CONNECTION_NAME }},DB_PORT=5432,DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},DB_NAME=${{ secrets.DB_NAME }},GOOGLE_BOOKS_API_KEY=${{ secrets.GOOGLE_BOOKS_API_KEY }}

      # ----------------------------------------------------------------------
      # Verificación y Salida del Servicio Desplegado
      # ----------------------------------------------------------------------
      - name: Display Cloud Run Service URL & Health Endpoint
        run: |
          echo "================================================================"
          echo "🚀 Despliegue en Google Cloud Run finalizado exitosamente"
          echo "🌐 URL del Servicio: ${{ steps.deploy.outputs.url }}"
          echo "🩺 Endpoint Health:  ${{ steps.deploy.outputs.url }}/api/health"
          echo "📚 Endpoint Escaneo: ${{ steps.deploy.outputs.url }}/api/libros/escanear"
          echo "================================================================"
